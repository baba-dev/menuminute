# Isolated development/CI dependencies only. These credentials are not production secrets.
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: menuminute_test
      POSTGRES_USER: foundation_owner
      POSTGRES_PASSWORD: isolated-ci-owner-password
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation_owner -d menuminute_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis-queue:
    image: redis:8.2.9-alpine
    command:
      [
        "redis-server",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "noeviction",
        "--appendonly",
        "yes",
      ]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis-cache:
    image: redis:8.2.9-alpine
    command:
      [
        "redis-server",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
