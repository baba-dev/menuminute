<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 420 880" width="420" height="880" class="oc-svg oc-play" data-paused="false" role="img" aria-labelledby="ocm-title ocm-desc" style="--food-x:130px;--food-half-x:64px;--food-y:88px;--ticket-x:149px;--ticket-y:164px;"><title id="ocm-title">MenuMinute — The Order Conveyor mobile illustration</title><desc id="ocm-desc">Concept preview of future online ordering. A guest browses a restaurant menu, adds a burger to the basket, chooses dine-in or pickup, submits an order request illustrated by a printed ticket, and restaurant staff accept it. This is not an active ordering interface.</desc><style><![CDATA[
.oc-svg {--canvas:#fffdf9;--scene:#fff8ed;--scene2:#ffeccc;--ink:#35251d;--muted:#806653;--frame:#3d3029;--line:#dbc5a8;--phone:#312720;--screen:#fffdf9;--paper:#fffefa;--card:#ffffff;--belt:#60483c;--belt-top:#f5d9ab;--metal:#cfb598;--shadow:#b67d48;--store:#a65a2b;--green:#527d37;--status:#2d753e;--status-bg:#d9efca;--accent:#fa641f;--gold:#f8b53c;--faint:#fcdfac;--food-shadow:#c08040;--ink-inverse:#fffaf2;--food-x:168px;--food-half-x:80px;--food-y:76px;--ticket-x:246px;--ticket-y:95px;font-family:Arial,'DejaVu Sans',sans-serif;isolation:isolate}
.oc-svg[data-theme="dark"] {--canvas:#14120f;--scene:#211b16;--scene2:#39291b;--ink:#f8e9d0;--muted:#d4b99a;--frame:#e2be91;--line:#69513d;--phone:#080808;--screen:#32281e;--paper:#f7e8ca;--card:#30251d;--belt:#161310;--belt-top:#8d6241;--metal:#a37449;--shadow:#0b0704;--store:#8b4822;--green:#709746;--status:#98d590;--status-bg:#264a32;--accent:#ff8b32;--gold:#ffd05d;--faint:#573a1e;--food-shadow:#0a0705;--ink-inverse:#23180f}
@media (prefers-color-scheme:dark) {.oc-svg:not([data-theme="light"]):not([data-theme="dark"]) {--canvas:#14120f;--scene:#211b16;--scene2:#39291b;--ink:#f8e9d0;--muted:#d4b99a;--frame:#e2be91;--line:#69513d;--phone:#080808;--screen:#32281e;--paper:#f7e8ca;--card:#30251d;--belt:#161310;--belt-top:#8d6241;--metal:#a37449;--shadow:#0b0704;--store:#8b4822;--green:#709746;--status:#98d590;--status-bg:#264a32;--accent:#ff8b32;--gold:#ffd05d;--faint:#573a1e;--food-shadow:#0a0705;--ink-inverse:#23180f}}
.oc-svg .ink{fill:var(--ink)}.oc-svg .muted{fill:var(--muted)}.oc-svg .small{font-size:13px;font-weight:700}.oc-svg .tiny{font-size:10px;font-weight:650}.oc-svg .sub{font-size:12px}.oc-svg .label{font-size:16px;font-weight:900;letter-spacing:.5px}.oc-svg .micro{font-size:9px;font-weight:750}.oc-svg text{user-select:none}
.oc-svg .oc-flying-food,.oc-svg .oc-ticket-travel {opacity:0}
.oc-svg .oc-basket-hit{transform-box:fill-box;transform-origin:center}
.oc-svg .oc-merchant-pending{opacity:0}.oc-svg .oc-merchant-accepted{opacity:1}
.oc-svg .oc-path-progress{stroke-dasharray:100;stroke-dashoffset:0}
.oc-svg.oc-play .oc-menu-entry{animation:oc-rise 8.2s linear both}
.oc-svg.oc-play .oc-flying-food{animation:oc-food 8.2s cubic-bezier(.24,.72,.28,1) both}
.oc-svg.oc-play .oc-basket-hit{animation:oc-basket 8.2s linear both}
.oc-svg.oc-play .oc-review{animation:oc-review 8.2s ease-out both}
.oc-svg.oc-play .oc-paper{animation:oc-print 8.2s ease-out both}
.oc-svg.oc-play .oc-ticket-travel{animation:oc-ticket 8.2s cubic-bezier(.42,0,.52,1) both}
.oc-svg.oc-play .oc-merchant-pending{animation:oc-pending 8.2s linear both}
.oc-svg.oc-play .oc-merchant-accepted{animation:oc-accepted 8.2s ease-out both}
.oc-svg.oc-play .oc-path-progress{animation:oc-trace 8.2s linear both}
.oc-svg.oc-play .oc-wheel{transform-box:fill-box;transform-origin:center;animation:oc-roll 8.2s linear both}
.oc-svg.oc-play .oc-final-spark{animation:oc-spark 8.2s ease-out both}
.oc-svg[data-paused="true"] *{animation-play-state:paused!important}
@keyframes oc-rise{0%{opacity:0;transform:translateY(13px)}8%,100%{opacity:1;transform:translateY(0)}}
@keyframes oc-food{0%,9%{opacity:0;transform:translate(0,0) scale(.72)}12%{opacity:1;transform:translate(10px,-12px) scale(.88)}19%{opacity:1;transform:translate(var(--food-half-x),-18px) scale(1)}27%{opacity:1;transform:translate(var(--food-x),var(--food-y)) scale(.68)}29%,100%{opacity:0;transform:translate(var(--food-x),var(--food-y)) scale(.68)}}
@keyframes oc-basket{0%,25%,100%{transform:translateY(0) scale(1)}27%{transform:translateY(4px) scale(1.02,.95)}30%{transform:translateY(-3px) scale(.99,1.02)}33%{transform:translateY(0) scale(1)}}
@keyframes oc-review{0%,28%{opacity:0;transform:translateY(12px)}34%,100%{opacity:1;transform:translateY(0)}}
@keyframes oc-print{0%,40%{opacity:0;transform:translateY(52px)}46%{opacity:1}59%,100%{opacity:1;transform:translateY(0)}}
@keyframes oc-ticket{0%,58%{opacity:0;transform:translate(0,0) rotate(-6deg)}60%{opacity:1;transform:translate(0,0) rotate(-6deg)}74%{opacity:1;transform:translate(var(--ticket-x),var(--ticket-y)) rotate(5deg)}77%,100%{opacity:0;transform:translate(var(--ticket-x),var(--ticket-y)) rotate(5deg)}}
@keyframes oc-pending{0%,74%{opacity:0}77%,85%{opacity:1}87%,100%{opacity:0}}
@keyframes oc-accepted{0%,84%{opacity:0;transform:translateY(6px)}90%,100%{opacity:1;transform:translateY(0)}}
@keyframes oc-trace{0%,58%{stroke-dashoffset:100}76%,100%{stroke-dashoffset:0}}
@keyframes oc-roll{0%,58%{transform:rotate(0deg)}76%,100%{transform:rotate(360deg)}}
@keyframes oc-spark{0%,87%{opacity:0;transform:scale(.55)}94%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.oc-svg *{animation:none!important}.oc-svg .oc-flying-food,.oc-svg .oc-ticket-travel,.oc-svg .oc-merchant-pending{opacity:0!important}.oc-svg .oc-merchant-accepted,.oc-svg .oc-review,.oc-svg .oc-paper{opacity:1!important;transform:none!important}.oc-svg .oc-path-progress{stroke-dashoffset:0!important}}
]]></style><defs>
