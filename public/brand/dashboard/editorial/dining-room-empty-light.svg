<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">Empty dining room illustration — light mode</title>
<desc id="desc">Two empty bentwood cafe chairs flank a cream-topped bistro table set with a small plate and an olive sprig, framed by botanical branches and soft editorial highlights.</desc>
<defs>
 <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E7AA6B"/><stop offset=".52" stop-color="#C77C44"/><stop offset="1" stop-color="#954C2B"/></linearGradient>
 <linearGradient id="woodDark" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#C77C44"/><stop offset="1" stop-color="#954C2B"/></linearGradient>
 <linearGradient id="seat" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F7C994"/><stop offset=".52" stop-color="#E6A166"/><stop offset="1" stop-color="#C77C44"/></linearGradient>
 <linearGradient id="tableTop" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#FFF8EA"/><stop offset=".54" stop-color="#F2DCBC"/><stop offset="1" stop-color="#E7C49E"/></linearGradient>
 <linearGradient id="tableRim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFE3A0"/><stop offset=".4" stop-color="#C98D3E"/><stop offset="1" stop-color="#845124"/></linearGradient>
 <linearGradient id="brass" x1="0" y1="0" x2=".95" y2=".9"><stop stop-color="#FFE3A0"/><stop offset=".48" stop-color="#C98D3E"/><stop offset="1" stop-color="#845124"/></linearGradient>
 <linearGradient id="plateGrad" x1="0" y1="0" x2=".85" y2=".9"><stop stop-color="#FBF5E9"/><stop offset="1" stop-color="#EDD9B6"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#F5D6B9" stop-opacity=".79"/><stop offset="1" stop-color="#F5D6B9" stop-opacity="0"/></radialGradient>
 <filter id="groundBlur" x="-45%" y="-80%" width="190%" height="260%"><feGaussianBlur stdDeviation="13"/></filter>
 <filter id="softDrop" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#724832" flood-opacity=".22"/></filter>
 <clipPath id="caneClip"><path d="M-48 36 C-48 5 -34 -13 -3 -14 C27 -13 44 3 45 36 L47 103 Q-4 95 -49 107Z"/></clipPath>
</defs>
