        <path d="M7 17 L7 10 Q7 7 10 7 L92 7" fill="none" stroke="#FFE5BA" stroke-width="2.5" opacity=".7" stroke-linecap="round"/>
        <circle cx="52.0" cy="43" r="22" fill="#EDD1AE" stroke="#9F6C49" stroke-width="1.8" stroke-dasharray="2.8 5.5"/>
        <circle cx="52.0" cy="43" r="13" fill="none" stroke="#B6825F" stroke-width="2.5" opacity=".68"/>
        <path d="M47.0 43 h10 M52.0 38 v10" stroke="#B6825F" stroke-width="2.2" stroke-linecap="round" opacity=".62"/>
        <path d="M19 83 H85 M19 98 H74 M19 113 H64" fill="none" stroke="#B98B6C" stroke-width="5.4" stroke-linecap="round" opacity=".7"/>
      </g>
<!-- Resting flatware flanks the empty plate -->
<g transform="translate(99 225) rotate(-22)">
 <path d="M-4 8 L-4 70 Q-4 78 0 78 Q4 78 4 70 L4 8" fill="url(#cutlery)" stroke="#6C452B" stroke-width="1.8"/>
 <path d="M-14 -23 L-14 -4 Q-13 13 0 16 Q13 13 14 -4 L14 -23 M-7 -23 L-7 7 M0 -23 L0 7 M7 -23 L7 7" fill="none" stroke="#B78353" stroke-width="4" stroke-linecap="round"/>
