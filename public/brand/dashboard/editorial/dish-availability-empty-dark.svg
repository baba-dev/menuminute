</g>
<!-- Very subtle open-space emblem on the empty center: only a delicate contour, no food -->
<g opacity=".62" fill="none" stroke="#CDA77E" stroke-width="2.3" stroke-linecap="round">
 <circle cx="241" cy="222" r="16" stroke-dasharray="2 6" opacity=".65"/>
 <path d="M233 222 h16 M241 214 v16" stroke="#E9AE72" stroke-width="2.8"/>
</g>
