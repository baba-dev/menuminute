 <ellipse cx="241" cy="219" rx="132" ry="55" fill="none" stroke="#FFF3D9" stroke-width="4" opacity=".8"/>
 <ellipse cx="242" cy="220" rx="111" ry="43.5" fill="#F6DFC0" stroke="#CDA77E" stroke-width="3.2"/>
