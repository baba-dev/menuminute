<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
<title id="title">Dish availability empty state — dark mode</title>
<desc id="desc">An airy illustration of an empty cream porcelain dinner plate in front of three unfilled recipe cards, with cutlery, olive branches and small golden accents. No food or availability claims are depicted.</desc>
<defs>
  <radialGradient id="glow"><stop stop-color="#765039" stop-opacity=".78"/><stop offset="1" stop-color="#765039" stop-opacity="0"/></radialGradient>
  <linearGradient id="cardPaper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E9C8A4"/><stop offset=".57" stop-color="#D6A981"/><stop offset="1" stop-color="#BC875F"/></linearGradient>
  <linearGradient id="plateSurface" x1=".08" y1="0" x2=".8" y2="1"><stop stop-color="#FFEDCB"/><stop offset=".52" stop-color="#E7C7A0"/><stop offset="1" stop-color="#B9875E"/></linearGradient>
  <linearGradient id="plateRim" x1=".1" y1="0" x2=".7" y2="1"><stop stop-color="#FFE5A4"/><stop offset=".35" stop-color="#DDA85D"/><stop offset=".82" stop-color="#A86732"/><stop offset="1" stop-color="#704329"/></linearGradient>
  <linearGradient id="cutlery" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#F3D2A0"/><stop offset=".45" stop-color="#B78353"/><stop offset="1" stop-color="#6C452B"/></linearGradient>
  <filter id="paperShadow" x="-35%" y="-30%" width="170%" height="175%"><feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#140F0C" flood-opacity=".28"/></filter>
  <filter id="plateShadow" x="-30%" y="-50%" width="160%" height="205%"><feDropShadow dx="0" dy="8" stdDeviation="5.5" flood-color="#140F0C" flood-opacity=".34"/></filter>
  <filter id="floorBlur" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<!-- No opaque rectangle: ready for both dashboard surfaces. -->
<ellipse cx="248" cy="180" rx="193" ry="154" fill="url(#glow)" opacity=".5"/>
<path d="M105 148 C117 93 161 65 213 54 C267 28 345 54 375 107 C421 156 398 237 350 275 C306 315 205 322 145 273 C104 238 86 194 105 148Z" fill="#765038" opacity=".12"/>
<!-- Printmaking flecks, a partial halo and tasteful plus sparkles -->
<path d="M122 111 Q210 40 321 76" fill="none" stroke="#E9AE72" stroke-width="2.1" stroke-dasharray="2 12" stroke-linecap="round" opacity=".3"/>
<path d="M72 140 v15 M64.5 147.5 h15 M417 99 v17 M408.5 107.5 h17" stroke="#DE9656" stroke-width="2.7" stroke-linecap="round" opacity=".75"/>
<circle cx="104" cy="84" r="3" fill="#E9AE72" opacity=".57"/><circle cx="400" cy="213" r="3.4" fill="#E9AE72" opacity=".54"/>
<path d="M376 141 q12 -9 23 -1 M89 239 q-11 -8 -20 -2" fill="none" stroke="#E9AE72" stroke-width="2.2" opacity=".45" stroke-linecap="round"/>
