<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 32" role="img" aria-label="MenuMinute three dots loading"><title>MenuMinute three dots loading</title><style>.move{animation:pulse 1s ease-in-out infinite}.b{animation-delay:.15s}.c{animation-delay:.3s}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.move{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}</style><rect x="1" y="1" width="118" height="30" rx="15" fill="#FF4B0A"/><g fill="#fff"><circle class="move a" cx="42" cy="16" r="4"/><circle class="move b" cx="60" cy="16" r="4"/><circle class="move c" cx="78" cy="16" r="4"/></g></svg>