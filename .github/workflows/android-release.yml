name: Android signed internal-release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed_aab:
    name: Sign and verify Play upload candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-play-internal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Load upload signing credentials without printing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for var in KEYSTORE_B64 STORE_PASS KEY_ALIAS KEY_PASS; do
            test -n "${!var}" || { echo "::error::Missing signing configuration"; exit 1; }
          done
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"
          echo "MM_ANDROID_UPLOAD_STORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "MM_ANDROID_UPLOAD_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "MM_ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MM_ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
      - name: Build signed Android App Bundle
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:bundleRelease
      - name: Verify Java archive signature
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify -strict "$AAB"
          sha256sum "$AAB" > "$AAB.sha256"
      - name: Retain signed candidate for manual Play internal testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: menuminute-android-signed-${{ github.sha }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
          retention-days: 7
