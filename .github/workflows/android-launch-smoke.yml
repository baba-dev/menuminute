name: Android TWA startup smoke (emulator)

on:
  pull_request:
    paths:
      - android/**
      - scripts/android/launch-smoke.sh
      - .github/workflows/android-launch-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    name: Launch Android TWA on a real emulator and capture crashes
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assemble unsigned debug APK with real launcher configuration
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Enable hardware virtualization for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch, and inspect TWA in Google Play emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          script: bash scripts/android/launch-smoke.sh
      - name: Preserve startup logs for debugging even after a failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: menuminute-android-startup-logcat
          path: android-launch-smoke/
          if-no-files-found: warn
          retention-days: 14
