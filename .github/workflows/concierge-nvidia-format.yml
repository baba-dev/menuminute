name: One-time Concierge NVIDIA Format
on:
  push:
    branches: [fix/concierge-nvidia-json-reasoning]
    paths: [.github/workflows/concierge-nvidia-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format targeted changed files
        run: |
          pnpm exec prettier --write \
            src/modules/intelligence/contracts.ts \
            src/modules/intelligence/providers/chat-http.ts \
            'src/app/api/public-menu/[token]/concierge/route.ts' \
            tests/concierge-nvidia-profile.test.ts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/modules/intelligence/contracts.ts \
            src/modules/intelligence/providers/chat-http.ts \
            'src/app/api/public-menu/[token]/concierge/route.ts' \
            tests/concierge-nvidia-profile.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(concierge): format NVIDIA request fix'
            git push origin HEAD:fix/concierge-nvidia-json-reasoning
          fi
