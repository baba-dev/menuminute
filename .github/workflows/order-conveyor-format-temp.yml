name: Temporary Order Conveyor formatter
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format-conveyor:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/homepage-order-conveyor'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply pinned Prettier to only this PR's files
        run: |
          pnpm exec prettier --write src/app/page.tsx src/components/marketing/order-conveyor/order-conveyor.tsx src/components/marketing/order-conveyor/order-conveyor-art.ts src/components/marketing/order-conveyor/order-conveyor.css tests/e2e/order-conveyor.spec.ts docs/order-conveyor.md
          git diff --check
          if ! git diff --quiet -- src/app/page.tsx src/components/marketing/order-conveyor/ tests/e2e/order-conveyor.spec.ts docs/order-conveyor.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/app/page.tsx src/components/marketing/order-conveyor/ tests/e2e/order-conveyor.spec.ts docs/order-conveyor.md
            git commit -m 'style(marketing): apply pinned Prettier to Order Conveyor'
            git push origin HEAD:${{ github.head_ref }}
          fi
