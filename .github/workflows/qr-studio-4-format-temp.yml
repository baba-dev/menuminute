name: QR Studio 4 one-time formatting helper
on:
  push:
    branches:
      - feature/qr-studio-4-connection-atelier

permissions:
  contents: write

jobs:
  format-branch:
    runs-on: ubuntu-24.04
    if: github.repository == 'baba-dev/menuminute'
    steps:
      - name: Checkout this feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/qr-studio-4-connection-atelier
          fetch-depth: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Format scoped files
        run: |
          pnpm exec prettier --write \
            'src/app/layout.tsx' \
            'src/app/api/qr/[qrId]/download/route.ts' \
            'src/components/menu-product/qr-manager.tsx' \
            'src/components/menu-product/qr-studio.css' \
            'src/components/menu-product/qr-create-dialog.tsx' \
            'src/components/menu-product/qr-create-dialog.module.css' \
            'src/components/menu-product/qr-print-contract.ts' \
            'src/components/menu-product/qr-print-sheet.tsx' \
            'src/components/menu-product/qr-print-studio.tsx' \
            'src/components/menu-product/qr-print.module.css' \
            'src/components/menu-product/qr-print-studio.module.css' \
            'src/components/menu-product/qr-print-themes.ts' \
            'src/components/menu-product/qr-print-fonts.ts' \
            'src/modules/qr/ink.ts' \
            'tests/qr-studio-4.test.tsx' \
            'tests/qr-create-dialog.test.tsx' \
            'docs/qr-studio-4-connection-atelier.md' \
            'tests/e2e/menu-product.spec.ts'
      - name: Commit scoped formatting only
        run: |
          git config user.name "menuminute-ci-format"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            'src/app/layout.tsx' \
            'src/app/api/qr/[qrId]/download/route.ts' \
            'src/components/menu-product/qr-manager.tsx' \
            'src/components/menu-product/qr-studio.css' \
            'src/components/menu-product/qr-create-dialog.tsx' \
            'src/components/menu-product/qr-create-dialog.module.css' \
            'src/components/menu-product/qr-print-contract.ts' \
            'src/components/menu-product/qr-print-sheet.tsx' \
            'src/components/menu-product/qr-print-studio.tsx' \
            'src/components/menu-product/qr-print.module.css' \
            'src/components/menu-product/qr-print-studio.module.css' \
            'src/components/menu-product/qr-print-themes.ts' \
            'src/components/menu-product/qr-print-fonts.ts' \
            'src/modules/qr/ink.ts' \
            'tests/qr-studio-4.test.tsx' \
            'tests/qr-create-dialog.test.tsx' \
            'docs/qr-studio-4-connection-atelier.md'
          if ! git diff --cached --quiet; then
            git commit -m "style(qr): apply repository Prettier formatting"
            git push origin HEAD:refs/heads/feature/qr-studio-4-connection-atelier
          fi
