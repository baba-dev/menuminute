name: Publish verified ARM64 artifact

# A successful same-repository main CI run is the only source of release bytes.
# Download the exact artifact from its run ID; never rebuild on publisher/VPS.
# workflow_run uses the default-branch SHA as github.sha: skip CI completions
# already superseded before dispatch (keep the later live-main rechecks).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_CI_CREATED_AT: ${{ github.event.workflow_run.created_at }}
    steps:
      - name: Authenticate source and final quality gate
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ && "$SOURCE_CI_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID" > "$RUNNER_TEMP/source-ci.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$RELEASE_SHA" '
              .name == "CI" and .path == ".github/workflows/ci.yml" and
              .head_repository.full_name == $repo and .head_sha == $sha and
              .event == "push" and .head_branch == "main" and
              .status == "completed" and .conclusion == "success"
            ' "$RUNNER_TEMP/source-ci.json" >/dev/null
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/jobs?per_page=100" |
            jq -se '([.[].jobs[] | select(.name == "Required CI quality gate" and .conclusion == "success")] | length) == 1' >/dev/null
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$latest" = "$RELEASE_SHA" || { echo "Superseded before publication"; exit 1; }
          source_start="$(date -d "$(jq -r .created_at "$RUNNER_TEMP/source-ci.json")" +%s)"
          source_running="$(date -d "$(jq -r .run_started_at "$RUNNER_TEMP/source-ci.json")" +%s)"
          source_end="$(date -d "$(jq -r .updated_at "$RUNNER_TEMP/source-ci.json")" +%s)"
          echo "CI_SECONDS=$(( source_end - source_running ))" >> "$GITHUB_ENV"
          echo "CI_QUEUE_SECONDS=$(( source_running - source_start ))" >> "$GITHUB_ENV"
          package_times="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID/jobs?per_page=100" |
            jq -r '.jobs[] | select(.name == "Production Build & Browser (ARM64)") | .steps[] |
              select(.name == "Package exact tested ARM64 build") | [.started_at,.completed_at] | @tsv')"
          [[ -n "$package_times" ]] || { echo "Missing exact CI packaging timing" >&2; exit 1; }
          read -r package_start package_end <<< "$package_times"
          echo "PACKAGING_SECONDS=$(( $(date -d "$package_end" +%s) - $(date -d "$package_start" +%s) ))" >> "$GITHUB_ENV"
          echo "PUBLISH_CREATED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')" >> "$GITHUB_ENV"

      - name: Download exact successfully tested CI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: menuminute-release-${{ env.RELEASE_SHA }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify native immutable release and publish
        id: released
        run: |
          set -Eeuo pipefail
          short="${RELEASE_SHA:0:12}"
          archive="menuminute-$short-linux-arm64.tar.gz"
          tag="arm64-$short"
          test -s "$archive"
          test -s "$archive.sha256"
          sha256sum --check --strict "$archive.sha256"
          test "$(tar -xOzf "$archive" ./RELEASE-SHA)" = "$RELEASE_SHA"
          digest="$(cut -d' ' -f1 "$archive.sha256")"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$latest" = "$RELEASE_SHA" || { echo "Superseded before immutable publication"; exit 1; }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release tag is not overwriteable" >&2
            exit 1
          fi
          gh release create "$tag" "$archive" "$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --title "MenuMinute ARM64 $short" --prerelease \
            --notes "Exact native ARM64 archive built and tested by successful main CI run $SOURCE_CI_RUN_ID for full SHA $RELEASE_SHA. Deployment status is separate."
          target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.target_commitish')"
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
          test "$target" = "$RELEASE_SHA" && test "$ref" = "$RELEASE_SHA"
          publish_seconds="$(( $(date -u +%s) - $(date -d "$PUBLISH_CREATED_AT" +%s) ))"
          jq -n --arg sha "$RELEASE_SHA" --arg run "$SOURCE_CI_RUN_ID" \
            --arg created "$SOURCE_CI_CREATED_AT" --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg digest "$digest" --arg tag "$tag" --arg archive "$archive" \
            --argjson bytes "$(stat -c %s "$archive")" --arg publisher "$GITHUB_RUN_ID" \
            --argjson ci_seconds "$CI_SECONDS" --argjson queue_seconds "$CI_QUEUE_SECONDS" \
            --argjson packaging_seconds "$PACKAGING_SECONDS" --argjson publish_seconds "$publish_seconds" \
            '{source_sha:$sha,source_ci_run_id:($run|tonumber),source_ci_created_at:$created,
              ci_duration_seconds:$ci_seconds,ci_queue_seconds:$queue_seconds,
              packaging_seconds:$packaging_seconds,publication_seconds:$publish_seconds,
              published_at:$published,artifact_sha256:$digest,artifact_name:$archive,
              artifact_bytes:$bytes,release_tag:$tag,publisher_run_id:($publisher|tonumber)}' > published-source.json
          echo "Published [$tag](https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag) from [CI run $SOURCE_CI_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID) with digest \`$digest\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload authenticated publication handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-source-${{ github.run_id }}
          path: published-source.json
          if-no-files-found: error
          retention-days: 7
