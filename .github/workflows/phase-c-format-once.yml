name: Phase C format (temporary)
on:
  push:
    branches:
      - feat/seo-phase-c-industry-solutions-20261101
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Apply repository Prettier formatting to Phase C
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin feat/marketing-seo-and-feature-pages-20261101
          git diff --name-only --diff-filter=ACM -z FETCH_HEAD HEAD -- '*.ts' '*.tsx' | xargs -0 -r pnpm exec prettier --write
          git add -u -- src
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(solutions): apply repository formatting'
            git push origin HEAD:feat/seo-phase-c-industry-solutions-20261101
          fi
