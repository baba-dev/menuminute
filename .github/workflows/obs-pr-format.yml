name: Observability PR one-off formatter
on:
  push:
    branches: [feat/low-overhead-logging-telemetry]
permissions:
  contents: write
concurrency:
  group: observability-prettier-single
  cancel-in-progress: false
jobs:
  format:
    if: github.repository == 'baba-dev/menuminute'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply pinned formatter to the PR branch
        run: |
          set -euo pipefail
          pnpm exec prettier --write .
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style(observability): normalize PR with pinned Prettier'
            git push origin HEAD:refs/heads/feat/low-overhead-logging-telemetry
          fi
