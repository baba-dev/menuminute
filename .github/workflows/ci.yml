name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, chore/phase-0-development-orchestration, security/auth-2-identity-recovery]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  APP_URL: http://localhost:3000
  AUTH_SECRET: isolated-ci-key-with-at-least-thirty-two-characters
  ORDER_EDGE_SHARED_SECRET: ci-only-order-proxy-attestation-never-use-on-live-server
  DATABASE_URL: postgresql://menuminute_app:isolated-ci-app-password@127.0.0.1:5432/menuminute_test
  MIGRATION_DATABASE_URL: postgresql://foundation_owner:isolated-ci-owner-password@127.0.0.1:5432/menuminute_test
  WORKER_DATABASE_URL: postgresql://menuminute_worker:isolated-ci-worker-password@127.0.0.1:5432/menuminute_test
  REDIS_QUEUE_URL: redis://127.0.0.1:6379
  REDIS_CACHE_URL: redis://127.0.0.1:6380
  MEDIA_ROOT: /tmp/menuminute-ci-media
  MEDIA_STORAGE: local
  MEDIA_OUTLET_BUDGET_BYTES: 104857600
  BETTER_AUTH_TELEMETRY: "0"
  EMAIL_PROVIDER: test
  AUTH_ALLOW_TEST_EMAIL: "true"
jobs:
  quality:
    name: Lint & Code Style
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm11.19.0-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node24-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        run: |
          if ! pnpm format:check; then
            echo "::group::Pinned Prettier differences"
            pnpm exec prettier --write . >/dev/null
            git --no-pager diff --check
            git --no-pager diff -- .github/workflows/ docs/ README.md AGENTS.md infra/ scripts/ src/ tests/
            echo "::endgroup::"
            exit 1
          fi

      - name: Validate approved dish artwork assets
        run: node scripts/food-artwork/verify.mjs

      - name: Verify India dish artwork backlog against the canonical manifest
        run: node scripts/food-artwork/verify-india-backlog.mjs

      - name: Check deployment and packaging shell syntax
        run: |
          bash -n infra/deploy/menuminute-release
          bash -n infra/deploy/package-release.sh

      - name: Validate unattended migration deployment policy
        run: python3 tests/deploy/migration-policy.py

      - name: Verify operator readiness and recovery guardrails (offline)
        run: python3 -m unittest discover -s tests/deploy -p 'test_*.py' -v

      - name: Lint source code (ESLint)
        run: pnpm lint

  typecheck:
    name: TypeScript Strict Typecheck
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Resolve pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm11.19.0-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  test:
    name: PostgreSQL & Redis Integration
    runs-on: ubuntu-24.04-arm
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Resolve pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm11.19.0-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f infra/compose.test.yml up -d --wait
      - run: pnpm exec tsx scripts/test-bootstrap.ts
      - run: pnpm db:migrate
      - run: pnpm build:worker
      - run: pnpm test
      - if: always()
        run: docker compose -f infra/compose.test.yml down -v
  build:
    name: Production Build & Browser (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Resolve pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm11.19.0-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f infra/compose.test.yml up -d --wait
      - run: pnpm exec tsx scripts/test-bootstrap.ts
        env:
          NODE_ENV: test
      - run: pnpm db:migrate
      - name: Compile production artifact before browser fixtures
        run: pnpm build
        env:
          NODE_ENV: production
          APP_URL: https://food.bababuilds.com
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
          # Public widget key is compiled into the immutable ARM64 release; never inject the secret here.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          AUTH_SECRET: 31724fb63d1f828e2c6ac702d77a13be9a1f7d41f592804bc
          EMAIL_PROVIDER: smtp
          EMAIL_FROM: food@bababuilds.com
          SMTP_HOST: mx.bababuilds.com
          SMTP_PORT: "465"
          SMTP_SECURE: "true"
          SMTP_USER: food@bababuilds.com
          SMTP_PASSWORD: synthetic-build-value-never-used
          AUTH_ALLOW_TEST_EMAIL: "false"
      - run: pnpm build:worker
      - run: pnpm exec esbuild scripts/db-migrate.ts --bundle --platform=node --format=esm --packages=external --outfile=dist/db-migrate.mjs
      - run: pnpm build:release-preflight
      - run: pnpm db:seed
        env:
          NODE_ENV: test
          ALLOW_DEMO_SEED: "true"
          DEMO_PASSWORD: isolated-browser-password
      - name: Cache Playwright Chromium
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Package exact tested ARM64 build
        if: success()
        run: bash infra/deploy/package-release.sh "$GITHUB_SHA"
      - name: Upload main production archive
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: menuminute-release-${{ github.sha }}
          path: |
            menuminute-*-linux-arm64.tar.gz
            menuminute-*-linux-arm64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
      - if: always()
        run: docker compose -f infra/compose.test.yml down -v

  ember_browser:
    name: Ember Enabled Browser (ARM64)
    runs-on: ubuntu-24.04-arm
    # Synthetic provider values; tests exercise real scoped SQL, never model inference.
    env:
      AI_FEATURES_ENABLED: "true"
      AI_ORCHESTRATOR_ENABLED: "true"
      AI_ASSISTANT_READ_ONLY_ENABLED: "true"
      AI_ASSISTANT_ACTIONS_ENABLED: "true"
      AI_CLOUDFLARE_ENABLED: "true"
      AI_CLOUDFLARE_TOOLS_VERIFIED: "true"
      AI_CLOUDFLARE_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      CLOUDFLARE_ACCOUNT_ID: "00000000000000000000000000000000"
      CLOUDFLARE_API_TOKEN: "synthetic-browser-test-never-used"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f infra/compose.test.yml up -d --wait
      - run: pnpm exec tsx scripts/test-bootstrap.ts
        env:
          NODE_ENV: test
      - run: pnpm db:migrate
      - name: Compile isolated Ember-enabled standalone browser fixture
        run: pnpm build
        env:
          NODE_ENV: production
          APP_URL: https://food.bababuilds.com
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
          AUTH_SECRET: 31724fb63d1f828e2c6ac702d77a13be9a1f7d41f592804bc
          EMAIL_PROVIDER: smtp
          EMAIL_FROM: food@bababuilds.com
          SMTP_HOST: mx.bababuilds.com
          SMTP_PORT: "465"
          SMTP_SECURE: "true"
          SMTP_USER: food@bababuilds.com
          SMTP_PASSWORD: synthetic-build-value-never-used
          AUTH_ALLOW_TEST_EMAIL: "false"
      - run: pnpm build:worker
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exercise real Ember drawer, availability confirmation and outlet isolation
        run: pnpm exec playwright test tests/e2e/ember.spec.ts tests/e2e/shift-summary.spec.ts
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ember-browser-failure-evidence
          path: test-results/
          retention-days: 7
      - if: always()
        run: docker compose -f infra/compose.test.yml down -v

  security:
    name: Dependency, Secret & Code Scanning
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Audit frozen dependencies
        run: pnpm audit --audit-level high
      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze repository
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1

  gate:
    name: Required CI quality gate
    if: always()
    needs: [quality, typecheck, test, build, ember_browser, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all mandatory lanes
        env:
          QUALITY: ${{ needs.quality.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          EMBER_BROWSER: ${{ needs.ember_browser.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          for result in "$QUALITY" "$TYPECHECK" "$TEST" "$BUILD" "$EMBER_BROWSER" "$SECURITY"; do
            test "$result" = success || { echo "::error::Mandatory lane did not pass: $result"; exit 1; }
          done
          echo "All six lanes (including isolated Ember browser and security) passed on $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
