name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify ARM64 runtime
        run: node -e 'if (process.platform !== "linux" || process.arch !== "arm64") throw new Error("Linux ARM64 required"); console.log(process.platform, process.arch, process.version)'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node24-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        run: pnpm format:check

      - name: Validate approved dish artwork assets
        run: node scripts/food-artwork/verify.mjs

      - name: Lint source code (ESLint)
        run: pnpm lint

  typecheck:
    name: TypeScript Strict Typecheck
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify ARM64 runtime
        run: node -e 'if (process.platform !== "linux" || process.arch !== "arm64") throw new Error("Linux ARM64 required"); console.log(process.platform, process.arch, process.version)'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node24-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Unit & Integration Tests (SQLite)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify ARM64 runtime
        run: node -e 'if (process.platform !== "linux" || process.arch !== "arm64") throw new Error("Linux ARM64 required"); console.log(process.platform, process.arch, process.version)'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node24-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: ./data/ci-test.sqlite
          AUTH_SECRET: ci-temporary-secret-minimum-sixteen-chars

  build:
    name: Production Build (ARM64)
    runs-on: ubuntu-24.04-arm
    needs: [lint-and-format, typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify ARM64 runtime
        run: node -e 'if (process.platform !== "linux" || process.arch !== "arm64") throw new Error("Linux ARM64 required"); console.log(process.platform, process.arch, process.version)'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node24-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Next.js Production Build
        run: pnpm build
        env:
          NODE_ENV: production
          DATABASE_URL: ./data/build.sqlite
          AUTH_SECRET: build-temporary-secret-minimum-sixteen-chars
          APP_URL: https://menuminute.com
