name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, chore/phase-0-development-orchestration, security/auth-2-identity-recovery]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  APP_URL: http://localhost:3000
  AUTH_SECRET: isolated-ci-key-with-at-least-thirty-two-characters
  ORDER_EDGE_SHARED_SECRET: ci-only-order-proxy-attestation-never-use-on-live-server
  DATABASE_URL: postgresql://menuminute_app:isolated-ci-app-password@127.0.0.1:5432/menuminute_test
  MIGRATION_DATABASE_URL: postgresql://foundation_owner:isolated-ci-owner-password@127.0.0.1:5432/menuminute_test
  WORKER_DATABASE_URL: postgresql://menuminute_worker:isolated-ci-worker-password@127.0.0.1:5432/menuminute_test
  REDIS_QUEUE_URL: redis://127.0.0.1:6379
  REDIS_CACHE_URL: redis://127.0.0.1:6380
  MEDIA_ROOT: /tmp/menuminute-ci-media
  MEDIA_STORAGE: local
  MEDIA_OUTLET_BUDGET_BYTES: 104857600
  BETTER_AUTH_TELEMETRY: "0"
  EMAIL_PROVIDER: test
  AUTH_ALLOW_TEST_EMAIL: "true"
jobs:
  quality:
    name: Lint & Code Style
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm11.19.0-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node24-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify API abuse boundaries
        run: node scripts/security/verify-api-boundaries.mjs
      - name: Enforce patched Next.js dependency floor
        run: node scripts/security/verify-framework-version.mjs

      - name: Check code formatting (Prettier)
        run: |
          if ! pnpm format:check; then
            echo "::group::Pinned Prettier differences"
            pnpm exec prettier --write . >/dev/null
            git --no-pager diff --check
            git --no-pager diff -- .github/workflows/ docs/ README.md AGENTS.md infra/ scripts/ src/ tests/
            echo "::endgroup::"
            exit 1
          fi

      - name: Validate approved dish artwork assets
        run: node scripts/food-artwork/verify.mjs

      - name: Verify India dish artwork backlog against the canonical manifest
        run: node scripts/food-artwork/verify-india-backlog.mjs

      - name: Check deployment and packaging shell syntax
        run: |
          bash -n infra/deploy/menuminute-release
          bash -n infra/deploy/package-release.sh

      - name: Validate unattended migration deployment policy
        run: python3 tests/deploy/migration-policy.py

      - name: Verify operator readiness and recovery guardrails (offline)
        run: python3 -m unittest discover -s tests/deploy -p 'test_*.py' -v
      - name: Verify browser-evidence integrity and immutable SHA contract (offline)
        run: node --test scripts/qa/phase5-browser-evidence.test.mjs infra/load/kitchen-contract.test.mjs

      - name: Lint source code (ESLint)
        run: pnpm lint
      - name: Verify Help Center content, navigation and Ember knowledge
        run: pnpm help:verify

  typecheck:
    name: TypeScript Strict Typecheck
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Resolve pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm11.19.0-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  test:
    # Four independent shards, each with its own PostgreSQL/Redis services and migrated database.
    # The matrix job result is "success" only when every shard passes, so the final gate stays closed.
    name: PostgreSQL & Redis Integration (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Resolve pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm11.19.0-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f infra/compose.test.yml up -d --wait
      - run: pnpm exec tsx scripts/test-bootstrap.ts
      - run: pnpm db:migrate
      - run: pnpm build:worker
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/4
      - if: always()
        run: docker compose -f infra/compose.test.yml down -v

  compile:
    # The only production compilation of the browser-tested, packaged release. Browser shards and the
    # packaging job consume this exact output (digest-checked) instead of rebuilding it.
    name: Production Compile (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Resolve pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm11.19.0-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Cache Next.js incremental build
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Compile production artifact before browser fixtures
        run: pnpm build
        env:
          NODE_ENV: production
          APP_URL: https://food.bababuilds.com
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
          # Public widget key is compiled into the immutable ARM64 release; never inject the secret here.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          AUTH_SECRET: 31724fb63d1f828e2c6ac702d77a13be9a1f7d41f592804bc
          EMAIL_PROVIDER: smtp
          EMAIL_FROM: food@bababuilds.com
          SMTP_HOST: mx.bababuilds.com
          SMTP_PORT: "465"
          SMTP_SECURE: "true"
          SMTP_USER: food@bababuilds.com
          SMTP_PASSWORD: synthetic-build-value-never-used
          AUTH_ALLOW_TEST_EMAIL: "false"
      - run: pnpm build:worker
      - run: pnpm exec esbuild scripts/db-migrate.ts --bundle --platform=node --format=esm --packages=external --outfile=dist/db-migrate.mjs
      - run: pnpm build:release-preflight
      - name: Bundle exact compiled output (symlinks and modes preserved)
        run: |
          set -Eeuo pipefail
          # `pnpm build` also generates git-ignored files under public/ (for example the dashboard editorial
          # images). The browser fixture and the release archive both serve public/, so they must travel too.
          git ls-files --others --ignored --exclude-standard -- public > generated-public-files.txt
          test -s generated-public-files.txt
          tar -cf - .next/standalone .next/static dist -T generated-public-files.txt | gzip -1 > compiled-build.tar.gz
          sha256sum compiled-build.tar.gz > compiled-build.tar.gz.sha256
          ls -l compiled-build.tar.gz
      - name: Share compiled output with browser shards and packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiled-build-${{ github.sha }}
          path: |
            compiled-build.tar.gz
            compiled-build.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  e2e:
    # Browser tests are sharded across runners. Each shard has isolated PostgreSQL/Redis services and
    # its own seeded database; blob reports are merged by the evidence job before evidence is summarized.
    name: Production Browser Shard ${{ matrix.shard }}/6
    needs: compile
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Resolve pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm11.19.0-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright Chromium
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium in the background while services start
        run: |
          rm -f "$RUNNER_TEMP/pw.exit"
          nohup bash -c 'pnpm exec playwright install --with-deps chromium; echo $? > "$RUNNER_TEMP/pw.exit"' > "$RUNNER_TEMP/pw-install.log" 2>&1 &
      - run: docker compose -f infra/compose.test.yml up -d --wait
      - run: pnpm exec tsx scripts/test-bootstrap.ts
        env:
          NODE_ENV: test
      - run: pnpm db:migrate
      - name: Fetch the single compiled production output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compiled-build-${{ github.sha }}
      - name: Verify and extract compiled output
        run: |
          set -Eeuo pipefail
          sha256sum --check --strict compiled-build.tar.gz.sha256
          tar -xzf compiled-build.tar.gz
          test -s .next/standalone/server.js
          test -s dist/worker.mjs
          test -s public/brand/dashboard/editorial/hero-mobile-light.webp
      - run: pnpm db:seed
        env:
          NODE_ENV: test
          ALLOW_DEMO_SEED: "true"
          DEMO_PASSWORD: isolated-browser-password
      - name: Wait for Chromium installation
        run: |
          until [ -f "$RUNNER_TEMP/pw.exit" ]; do sleep 1; done
          cat "$RUNNER_TEMP/pw-install.log"
          test "$(cat "$RUNNER_TEMP/pw.exit")" = 0
      - name: Run browser shard ${{ matrix.shard }}/6
        # Pull requests exercise desktop Chromium; pushes to main (the only releasable path) run every project.
        run: |
          projects=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then projects=(--project=chromium); fi
          pnpm exec playwright test "${projects[@]}" --shard=${{ matrix.shard }}/6 --reporter=blob,github
      - name: Retain shard report for exact-SHA evidence merge
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-blob-${{ github.sha }}-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: warn
          retention-days: 1
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-evidence-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
      - if: always()
        run: docker compose -f infra/compose.test.yml down -v

  build:
    # Keeps the historical check name consumed by publish-arm64.yml. It packages the exact compilation that
    # every browser shard exercises, in parallel with them; promotion to the releasable artifact name
    # happens only in `evidence`, after every shard has passed.
    name: Production Build & Browser (ARM64)
    needs: compile
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Resolve pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm11.19.0-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Fetch the exact compiled output shared with the browser shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compiled-build-${{ github.sha }}
      - name: Verify and extract compiled output
        run: |
          set -Eeuo pipefail
          sha256sum --check --strict compiled-build.tar.gz.sha256
          tar -xzf compiled-build.tar.gz
          test -s public/brand/dashboard/editorial/hero-mobile-light.webp
      - name: Package exact tested ARM64 build
        run: bash infra/deploy/package-release.sh "$GITHUB_SHA"
      - name: Retain release candidate for promotion after browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            menuminute-*-linux-arm64.tar.gz
            menuminute-*-linux-arm64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  evidence:
    name: Browser Evidence & Release Promotion
    needs: [e2e, build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Resolve pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm11.19.0-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Fetch all browser shard reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: playwright-blob-${{ github.sha }}-*
          merge-multiple: true
          path: all-blob-reports
      - name: Merge sharded Playwright reports
        run: |
          set -Eeuo pipefail
          mkdir -p test-results
          test "$(ls all-blob-reports/*.zip | wc -l)" -eq 6
          pnpm exec playwright merge-reports --reporter=json all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/phase5-browser-report.json
      - name: Summarize Phase 5 production browser evidence at exact SHA
        run: node scripts/qa/phase5-browser-evidence.mjs test-results/phase5-browser-report.json test-results/phase5-browser-summary.json "$GITHUB_SHA" production-browser
      - name: Retain synthetic browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase5-browser-evidence-production-${{ github.sha }}
          path: test-results/phase5-browser-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fetch the packaged release candidate
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ github.sha }}
      - name: Upload main production archive
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: menuminute-release-${{ github.sha }}
          path: |
            menuminute-*-linux-arm64.tar.gz
            menuminute-*-linux-arm64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-evidence-merged
          path: test-results/
          retention-days: 7

  ember_browser:
    name: Ember Enabled Browser (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    # Synthetic provider values; tests exercise real scoped SQL, never model inference.
    env:
      AI_FEATURES_ENABLED: "true"
      AI_ORCHESTRATOR_ENABLED: "true"
      AI_ASSISTANT_READ_ONLY_ENABLED: "true"
      AI_ASSISTANT_ACTIONS_ENABLED: "true"
      AI_CLOUDFLARE_ENABLED: "true"
      AI_CLOUDFLARE_TOOLS_VERIFIED: "true"
      AI_CLOUDFLARE_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      CLOUDFLARE_ACCOUNT_ID: "00000000000000000000000000000000"
      CLOUDFLARE_API_TOKEN: "synthetic-browser-test-never-used"
      AI_EMBER_CLOUDFLARE_INPUT_MICROUSD_MTOK: "1000"
      AI_EMBER_CLOUDFLARE_OUTPUT_MICROUSD_MTOK: "1000"
      AI_EMBER_CLOUDFLARE_DAILY_CAP_MICROUSD: "1000000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Resolve pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
      - name: Cache pnpm store
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm11.19.0-${{ hashFiles('**/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f infra/compose.test.yml up -d --wait
      - run: pnpm exec tsx scripts/test-bootstrap.ts
        env:
          NODE_ENV: test
      - run: pnpm db:migrate
      - name: Compile isolated Ember-enabled standalone browser fixture
        run: pnpm build
        env:
          NODE_ENV: production
          APP_URL: https://food.bababuilds.com
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
          AUTH_SECRET: 31724fb63d1f828e2c6ac702d77a13be9a1f7d41f592804bc
          EMAIL_PROVIDER: smtp
          EMAIL_FROM: food@bababuilds.com
          SMTP_HOST: mx.bababuilds.com
          SMTP_PORT: "465"
          SMTP_SECURE: "true"
          SMTP_USER: food@bababuilds.com
          SMTP_PASSWORD: synthetic-build-value-never-used
          AUTH_ALLOW_TEST_EMAIL: "false"
      - run: pnpm build:worker
      - name: Cache Playwright Chromium
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exercise real Ember drawer, availability confirmation and outlet isolation
        run: pnpm exec playwright test tests/e2e/ember.spec.ts tests/e2e/shift-summary.spec.ts tests/e2e/shell-ember.spec.ts
      - name: Summarize Phase 5 Ember-enabled browser evidence at exact SHA
        run: node scripts/qa/phase5-browser-evidence.mjs test-results/phase5-browser-report.json test-results/phase5-browser-summary.json "$GITHUB_SHA" ember-browser
      - name: Retain synthetic Ember browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase5-browser-evidence-ember-${{ github.sha }}
          path: test-results/phase5-browser-summary.json
          if-no-files-found: warn
          retention-days: 14
      - if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ember-browser-failure-evidence
          path: test-results/
          retention-days: 7
      - if: always()
        run: docker compose -f infra/compose.test.yml down -v

  security:
    name: Dependency, Secret & Code Scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Audit frozen dependencies
        run: pnpm audit --audit-level high
      - name: List moderate advisories for security follow-up
        # The high-severity audit above is still a hard failure. Moderate findings
        # are logged for triage without blocking unrelated safe releases.
        run: pnpm audit --audit-level moderate --json || true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze repository
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

  gate:
    name: Required CI quality gate
    if: always()
    # Packaging, every browser shard and the evidence/promotion job are all mandatory lanes here.
    needs: [quality, typecheck, test, build, e2e, evidence, ember_browser, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all mandatory lanes
        env:
          QUALITY: ${{ needs.quality.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          EVIDENCE: ${{ needs.evidence.result }}
          EMBER_BROWSER: ${{ needs.ember_browser.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          for result in "$QUALITY" "$TYPECHECK" "$TEST" "$BUILD" "$E2E" "$EVIDENCE" "$EMBER_BROWSER" "$SECURITY"; do
            test "$result" = success || { echo "::error::Mandatory lane did not pass: $result"; exit 1; }
          done
          echo "All six lanes (including isolated Ember browser and security) passed on $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
