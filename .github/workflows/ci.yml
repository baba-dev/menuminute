name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, chore/phase-0-development-orchestration]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  APP_URL: http://localhost:3000
  AUTH_SECRET: isolated-ci-key-with-at-least-thirty-two-characters
  DATABASE_URL: postgresql://menuminute_app:isolated-ci-app-password@127.0.0.1:5432/menuminute_test
  MIGRATION_DATABASE_URL: postgresql://foundation_owner:isolated-ci-owner-password@127.0.0.1:5432/menuminute_test
  WORKER_DATABASE_URL: postgresql://menuminute_worker:isolated-ci-worker-password@127.0.0.1:5432/menuminute_test
  REDIS_QUEUE_URL: redis://127.0.0.1:6379
  REDIS_CACHE_URL: redis://127.0.0.1:6380
  MEDIA_ROOT: /tmp/menuminute-ci-media
  MEDIA_STORAGE: local
  MEDIA_OUTLET_BUDGET_BYTES: 104857600
  BETTER_AUTH_TELEMETRY: "0"
jobs:
  quality:
    name: Lint & Code Style
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-node24-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node24-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inspect CD test format delta (temporary)
        run: pnpm exec prettier tests/deploy-automation.test.ts | diff -u tests/deploy-automation.test.ts - || true

      - name: Check code formatting (Prettier)
        run: pnpm format:check

      - name: Validate approved dish artwork assets
        run: node scripts/food-artwork/verify.mjs

      - name: Check VPS deployment script syntax
        run: bash -n infra/deploy/menuminute-release

      - name: Lint source code (ESLint)
        run: pnpm lint

  typecheck:
    name: TypeScript Strict Typecheck
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  test:
    name: PostgreSQL & Redis Integration
    runs-on: ubuntu-24.04-arm
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f infra/compose.test.yml up -d --wait
      - run: pnpm exec tsx scripts/test-bootstrap.ts
      - run: pnpm db:migrate
      - run: pnpm build:worker
      - run: pnpm test
      - if: always()
        run: docker compose -f infra/compose.test.yml down -v
  build:
    name: Production Build & Browser (ARM64)
    runs-on: ubuntu-24.04-arm
    needs: [quality, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node -e 'if(process.arch!=="arm64")throw new Error("ARM64 required")'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f infra/compose.test.yml up -d --wait
      - run: pnpm exec tsx scripts/test-bootstrap.ts
        env:
          NODE_ENV: test
      - run: pnpm db:migrate
      - run: pnpm db:seed
        env:
          NODE_ENV: test
          ALLOW_DEMO_SEED: "true"
          DEMO_PASSWORD: isolated-browser-password
      - run: pnpm build
        env:
          NODE_ENV: production
          APP_URL: https://menuminute.invalid
          AUTH_SECRET: 31724fb63d1f828e2c6ac702d77a13be9a1f7d41f592804bc
      - run: pnpm build:worker
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
      - if: always()
        run: docker compose -f infra/compose.test.yml down -v
